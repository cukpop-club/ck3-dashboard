<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CK3 Dashboard</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1a1a1f;--mu:#66666f;--ac:#7c4dff;--bd:#e2e2e8;--ok:#1f9d63;--wa:#c98a00;--no:#c0392b;--bl:#2f80ed;--sm:#e8590c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0f;--card:#1a1a1e;--tx:#f2f2f4;--mu:#a0a0aa;--ac:#a98bff;--bd:#34343a;--ok:#4cc790;--wa:#e8b430;--no:#ff7a6b;--bl:#6aa7ff;--sm:#ff922b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0f;--card:#1a1a1e;--tx:#f2f2f4;--mu:#a0a0aa;--ac:#a98bff;--bd:#34343a;--ok:#4cc790;--wa:#e8b430;--no:#ff7a6b;--bl:#6aa7ff;--sm:#ff922b;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
#thm{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;line-height:1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 16px 4px;max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}
nav{display:flex;gap:6px;padding:10px 16px;max-width:900px;margin:auto;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:auto;padding:4px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:16px}.mu{color:var(--mu);font-size:13px}
.rel{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-color:var(--ok)}.can{background:color-mix(in srgb,var(--no) 12%,var(--card));border-color:var(--no)}.up{background:color-mix(in srgb,var(--ac) 14%,var(--card));border-color:var(--ac)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--c,var(--mu))}select.sc{border-color:var(--c,var(--bd));border-width:2px}.s-Active-Fall{--c:var(--ok)}.s-Active-Winter{--c:var(--bl)}.s-Active-Summer{--c:var(--sm)}.s-Hiatus{--c:var(--wa)}.s-Left{--c:var(--no)}.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px;border-radius:10px;font-size:14px;cursor:pointer}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.hm{font-weight:600;padding:9px 0}.hm.sel{outline:2px solid var(--tx)}.ann{background:color-mix(in srgb,var(--wa) 14%,var(--card));border-color:var(--wa)}textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}.x{border:0;background:transparent;color:var(--mu);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}.mk{border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:14px;padding:5px 11px;font-size:12px;cursor:pointer;margin:6px 6px 0 0}.tiny{font-size:11px;margin-left:6px;white-space:nowrap}.pl{display:inline-block;margin-top:6px;padding:5px 12px;border:1px solid var(--ac);border-radius:16px;text-decoration:none;font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:12px;border:1px solid var(--bd);margin:2px 4px 2px 0}
.Released,.Active,.ok{color:var(--ok);border-color:var(--ok)}.Editing,.Learning{color:var(--wa);border-color:var(--wa)}.Cancelled,.Left,.bad{color:var(--no);border-color:var(--no)}.ev{color:var(--ac);border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:24px;color:var(--ac)}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:15px;cursor:pointer;width:100%}.btn:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row select{width:auto;margin:0;padding:6px}
.bar{height:8px;border-radius:4px;background:var(--ac);margin-top:4px}
.ag{display:grid;grid-template-columns:42px repeat(7,1fr);gap:4px;align-items:center;margin:8px 0 12px}.ag b{font-size:12px;color:var(--mu);text-align:center}
.sl{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 0;font-size:13px;cursor:pointer}.sl.on{background:var(--ac);color:#fff;border-color:var(--ac)}
a{color:var(--ac)}.note{font-size:13px;color:var(--mu);padding:8px 2px}
#ref{border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}#ref:active{transform:scale(.96)}#ref:disabled{opacity:.7}#ref i{display:inline-block;font-style:normal}#ref.spin i{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}#upd{font-size:11px;color:var(--mu);text-align:right;margin-top:2px}

header{flex-wrap:wrap;gap:8px}
#help{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:0 14px;height:38px;font-size:14px;cursor:pointer}
button,select,input,textarea,.card,a,.row{transition:background .15s,border-color .15s,box-shadow .15s,transform .15s,color .15s,filter .15s}
button:not(:disabled):active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
@media (hover:hover){
 nav button:hover{border-color:var(--ac);transform:translateY(-1px)}
 nav button.on:hover{filter:brightness(1.08)}
 .card:hover{border-color:var(--ac);box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 18%,transparent)}
 .btn:not(:disabled):hover,#ref:not(:disabled):hover,.pr:hover{filter:brightness(1.12);transform:translateY(-1px)}
 #thm:hover,#help:hover,.seg button:hover,.gh:hover,.sl:not(.on):hover{border-color:var(--ac);color:var(--ac)}
 .sl.on:hover{filter:brightness(1.12)}
 .hm:hover{outline:2px solid var(--ac)}
 .mk:hover{background:var(--ac);color:#fff;transform:translateY(-1px)}
 .pl:hover{background:var(--ac);color:#fff}
 select:hover,input:hover,textarea:hover{border-color:var(--ac)}
 .row:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
 a:hover{text-decoration:underline}
 .x:hover{color:var(--tx)}
 .dg:hover{filter:brightness(1.12)}
}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:24px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--no);color:#fff}#toast.ok{background:var(--ok);color:#fff}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}.dlg[hidden],#tour[hidden]{display:none}
.dbox{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:18px;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.35)}.dbox p{margin:0 0 14px}
.dbtn{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.gh{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
.pr,.dg{border:0;color:#fff;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer}.pr{background:var(--ac)}.dg{background:var(--no)}
#tour{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--tx);border:2px solid var(--ac);border-radius:14px;padding:14px 16px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#tour h3{margin:2px 0 4px;font-size:17px}#tour p{margin:0 0 12px}.tc{font-size:12px;color:var(--mu)}
.hl{outline:3px solid var(--wa);outline-offset:3px;border-radius:10px;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,170,0,.55)}50%{box-shadow:0 0 0 9px rgba(255,170,0,0)}}
.pillc{display:inline-block;padding:7px 16px;border-radius:20px;background:color-mix(in srgb,var(--wa) 18%,var(--card));border:1px solid var(--wa);color:var(--wa);font-size:13px;font-weight:600;margin:4px 0}ul.bl{margin:8px 0 4px;padding-left:22px}ul.bl li{margin:2px 0}</style></head><body>
<header><h1>CK3 Dashboard</h1><div style="display:flex;gap:8px;align-items:flex-start"><button id="help" title="How to use this app">?</button><button id="thm" title="Switch light / dark mode" aria-label="Switch light or dark mode">🌙</button><div><button id="ref"><i>↻</i> <span>Refresh</span></button><div id="upd"></div></div></div></header>
<nav id="nav"></nav><main id="app"><p class="note">Loading…</p></main>
<div id="toast" role="status" aria-live="polite"></div><div id="dlg" class="dlg" hidden></div><div id="tour" role="dialog" aria-label="App guide" hidden></div>
<script>
const TABS=["Home","Board","Members","Top 2 Picks","Availability","Suggest","Units"];
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],HOURS=Array.from({length:13},(_,i)=>i+9),MINU=2;
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let CODE="";try{CODE=localStorage.getItem("ck3code")||""}catch(e){}
const run=(fn,...a)=>new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](CODE,...a));
const cls=s=>String(s||"none").replace(/\s+/g,"-");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PER=(()=>{const t=new Date(),y=t.getFullYear(),s=t.getMonth()-t.getMonth()%2;return Array.from({length:6},(_,i)=>{const mm=s+2*i,yy=y+Math.floor(mm/12),a=mm%12;return{k:"P"+yy+"-"+String(a+1).padStart(2,"0"),l:MN[a]+"–"+MN[a+1]+" "+yy}})})();
const t0=new Date();let per=PER[(t0.getMonth()%2==0&&t0.getDate()<=10)?0:1].k;
let D=null,tab=0,pickMember="",availMember="",draft=null,availView="all",cell="",vpPw="",vpOpen=false;
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const dl=s=>{const n=Math.ceil((pd(s)-new Date())/864e5);return n<0?"past":n==0?"today":n==1?"tomorrow":"in "+n+" days"};
const dlab=s=>pd(s).toLocaleDateString("en",{month:"short",day:"numeric"});
const mname=id=>(D.members.find(m=>m.id==id)||{name:"?"}).name;
const isActive=m=>/^Active/.test(m.status);
const seasonOfKey=k=>{const m=+String(k).slice(-2);return m>=9?"Fall":m>=5?"Summer":"Winter"};
const curSeason=()=>{const m=new Date().getMonth()+1;return m>=9?"Fall":m>=5?"Summer":"Winter"};
const actIn=season=>D.members.filter(m=>m.status=="Active "+season);
const av=id=>(D.avail.find(a=>a.id==id)||{}).slots;
const pk=id=>D.picks.find(p=>p.p==per&&p.id==id);
const perSel=id=>`<select id="${id}">${PER.map(p=>`<option value="${p.k}" ${p.k==per?"selected":""}>${p.l}</option>`).join("")}</select>`;
const nav=document.getElementById("nav"),app=document.getElementById("app");
async function load(){if(!CODE){showLock("");return}const b=document.getElementById("ref"),lb=b.querySelector("span");b.disabled=true;b.classList.add("spin");lb.textContent="Refreshing…";
 try{const r=await run("getData"),mem=r.members.filter(m=>m.status!="Left"),ids=new Set(mem.map(m=>m.id));
  D={...r,members:mem,units:r.units.map(u=>({...u,ids:u.ids.filter(i=>ids.has(i))})),picks:r.picks.filter(p=>ids.has(p.id)),avail:r.avail.filter(a=>ids.has(a.id))};
  document.getElementById("upd").textContent="Updated "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});render();if(!tourAuto){tourAuto=true;if(!guideSeen())tourShow(0)}}
 catch(e){const m=String(e&&e.message||e);if(/BAD_CODE/.test(m)){badCode();showLock("That code did not work. Ask an Exec for the current code.")}else if(/Access code not set/.test(m))showLock(m.replace(/^Error:\s*/,""));else app.innerHTML=`<p class="note">Could not load data. ${esc(m)}</p>`}
 b.disabled=false;b.classList.remove("spin");lb.textContent="Refresh"}
document.getElementById("ref").onclick=load;
function render(){
 nav.innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" data-i="${i}">${t}</button>`).join("");
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=+b.dataset.i;render()});
 app.innerHTML=[home,board,members,picksV,availV,suggestV,units][tab]()+`<p class="note" style="text-align:center;margin-top:24px"><a href="#" id="sgl">💡 Suggest an improvement</a></p>`;bind();tourMark();
}
function home(){
 const B=D.board,c=s=>B.filter(b=>b.status==s).length,cs=curSeason(),act=actIn(cs).length,ps=actIn(seasonOfKey(per)),sub=D.picks.filter(p=>p.p==per&&ps.some(m=>m.id==p.id)).length;
 const up=B.filter(b=>b.date&&dl(b.date)!="past").sort((x,y)=>x.date.localeCompare(y.date));
 return annCard()+`<div class="stats"><div class="stat"><b>${act}</b>Active ${cs}</div><div class="stat"><b>${c("Learning")}</b>In progress</div><div class="stat"><b>${c("Editing")}</b>In editing</div><div class="stat"><b>${c("Released")}</b>Released</div><div class="stat"><b>${sub}/${ps.length}</b>Picks in</div></div>
 <div class="card up"><h3>📅 Upcoming events</h3>${up.map(b=>`<div class="row"><span>${esc(b.name)}${/^https?:/.test(b.link)?` <a class="tiny" href="${esc(b.link)}" target="_blank" rel="noopener">▶ playlist</a>`:""}</span><span class="tag ev" style="margin:0">${dlab(b.date)} · ${dl(b.date)}</span></div>`).join("")||`<p class="mu">No upcoming events. Add dates in the "Event Date" column of Board 2026.</p>`}</div>
 <div class="card"><h3>This semester</h3><p class="mu">• Minimum 2 dance projects per two-month period.<br>• Update your status, availability and Top 2 songs in the first week of each period.<br>• Units are formed from availability + member status.</p></div>`;
}
function annCard(){
 const U=D.updates||[];
 if(!U.length&&!vpOpen&&!vpPw)return `<p class="note" style="text-align:right;margin:0"><a href="#" id="vpl">🔒 Exec tools</a></p>`;
 const del=u=>vpPw?`<a href="#" data-del="${u.row}">delete</a>`:"";
 return `<div class="card ann"><div style="display:flex;justify-content:space-between;align-items:center"><h3>📢 Updates</h3>${vpOpen||vpPw?`<button class="x" id="vpc" aria-label="Close" title="Close">✕</button>`:""}</div>${U.slice(0,5).map(u=>`<div class="row" style="display:block"><div class="mu">${u.date?dlab(u.date):""}${u.date&&vpPw?" · ":""}${del(u)}</div><div style="white-space:pre-line">${esc(u.text)}</div></div>`).join("")||`<p class="mu">No updates right now.</p>`}
 ${vpPw?`<div style="margin-top:8px"><label>New update</label><textarea id="vpt" rows="3" maxlength="600" placeholder="e.g. New round of projects starts mid-Nov"></textarea><label>Hide after (optional)</label><input id="vph" type="date"><button class="btn" id="vpp">Post update</button><p class="note"><a href="#" id="vpx">Lock Exec tools</a></p></div>`:vpOpen?`<div style="margin-top:8px"><label>VP password</label><input id="vpw" type="password" autocomplete="off"><button class="btn" id="vpu">Unlock</button></div>`:`<p class="note" style="margin:6px 0 0"><a href="#" id="vpl">🔒 Exec tools</a></p>`}</div>`;
}
function board(){return D.board.map(b=>{const r=b.status=="Released",ev=b.event&&b.event!="-"?b.event:"";return `<div class="card ${r?"rel":b.status=="Cancelled"?"can":""}"><h3>${esc(b.name)}</h3><span class="tag ${esc(b.status)}">${esc(b.status)}</span><span class="tag">${esc(b.type)}</span>${b.date?`<div><span class="tag ev">${dlab(b.date)} · ${dl(b.date)}</span></div>`:""}<div class="mu">${esc(ev)}${r||!b.sched?"":(ev?" · ":"")+esc(b.sched)}</div>${/^https?:/.test(b.link)?`<a class="pl" href="${esc(b.link)}" target="_blank" rel="noopener">▶ Playlist</a>`:`<span class="mu">No playlist yet</span>`}</div>`}).join("")}
function members(){return `<p class="note">Update your own status each period.</p><div class="card">`+D.members.map(m=>`<div class="row"><span><i class="dot s-${cls(m.status)}"></i>${esc(m.name)}</span><select class="sc s-${cls(m.status)}" data-st="${m.id}">${["","Active Fall","Active Winter","Active Summer","Hiatus","Left"].map(o=>`<option ${o==m.status?"selected":""} value="${o}">${o||"Not set"}</option>`).join("")}</select></div>`).join("")+`</div>`}
function songs(){return D.board.filter(b=>b.status!="Cancelled"&&b.status!="Released").map(b=>b.name)}
function tally(){
 const k=x=>x.toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");
 const parse=x=>{const t=x.trim(),m=t.split(/\s+[-–—]\s+/);
  if(m.length>1&&!/^(any|all|anything)\b/i.test(m.slice(1).join(" ").trim()))return{ak:k(m[0]),sk:k(m.slice(1).join(" "))};
  return{ak:k(m[0].replace(/^(any|all|anything by|anything from|any of)\s+/i,"").replace(/\s+(songs?|anything|music)$/i,"")),wide:true}};
 const sp={},wd={};
 D.picks.filter(p=>p.p==per).forEach(p=>{const m=D.members.find(x=>x.id==p.id);if(!m||m.status!="Active "+seasonOfKey(per))return;
  [p.a,p.b].forEach(x=>{if(!x)return;const q=parse(x);
   if(q.wide){const w=wd[q.ak]=wd[q.ak]||{s:x,ids:[]};if(!w.ids.includes(p.id))w.ids.push(p.id)}
   else{const key=q.ak+"|"+q.sk,o=sp[key]=sp[key]||{s:x,ak:q.ak,ids:[],flex:[]};if(!o.ids.includes(p.id))o.ids.push(p.id)}})});
 const out=Object.values(sp);
 Object.entries(wd).forEach(([ak,w])=>{const m=out.filter(o=>o.ak==ak);
  if(m.length)m.forEach(o=>w.ids.forEach(id=>{if(!o.ids.includes(id)){o.ids.push(id);o.flex.push(id)}}));
  else out.push({s:w.s,ak,ids:[...w.ids],flex:[...w.ids]})});
 return out}
let lastRows=[];
const same=(x,y)=>!!x&&!!y&&x.trim().toLowerCase()==y.trim().toLowerCase();
function pickBtns(r,ix){const c=pk(+pickMember)||{};return [1,2].map(n=>same(n==1?c.a:c.b,r.s)?`<span class="tag ok">✓ Your Top ${n}</span>`:`<button class="mk" data-ps="${ix}" data-n="${n}">Make Top ${n}</button>`).join("")}
function picksV(){
 if(pickMember&&!actIn(seasonOfKey(per)).some(m=>m.id==pickMember))pickMember="";
 const rows=tally().sort((x,y)=>y.ids.length-x.ids.length),mx=rows[0]?.ids.length||1,cur=pk(+pickMember)||{};lastRows=rows;
 const ps=seasonOfKey(per),miss=actIn(ps).filter(m=>!pk(m.id)).map(m=>m.name);
 return `<div class="card"><label>Period</label>${perSel("per")}<label>Who are you?</label><select id="who"><option value="">Select…</option>${actIn(ps).map(m=>`<option value="${m.id}" ${m.id==pickMember?"selected":""}>${esc(m.name)}</option>`).join("")}</select><p class="note" style="margin:0 0 10px">Showing Active ${ps} members for this period. Not listed? Set your status in Members first.</p>
 <p class="note" style="margin:0 0 4px">Type a song, or "Any BTS songs" if you are open to any. This applies to both picks.</p><label>Pick 1</label><input id="a" list="sl" value="${esc(cur.a||"")}" placeholder="e.g. Katseye - Gnarly"><label>Pick 2</label><input id="b" list="sl" value="${esc(cur.b||"")}" placeholder="Second choice"><datalist id="sl">${songs().map(s=>`<option value="${esc(s)}">`).join("")}</datalist>
 ${cur.a||cur.b?`<p class="note">You already submitted picks for this period. Change them and tap Save, or delete them.</p>`:""}<button class="btn" id="save">Save</button>${cur.a||cur.b?`<button class="btn" id="pdel" style="background:transparent;color:var(--no);border:1px solid var(--no);margin-top:8px">Delete my picks</button>`:""}<ul class="note bl"><li>Picks show interest only, not a guarantee.</li><li>You can repeat a song in a later period.</li><li>Only Active ${ps} members are shown, based on the period you selected.</li></ul></div>
 <h3>Overlap in interest</h3><p class="note">Like a song someone else picked? Choose your name above, then tap Make Top 1 or Make Top 2.</p>${rows.length?rows.map((r,ix)=>`<div class="card"><b>${esc(r.s)}</b> <span class="tag">${r.ids.length} ${r.ids.length>1?"votes":"vote"}</span><div class="bar" style="width:${r.ids.length/mx*100}%"></div><div class="mu">${esc(r.ids.map(i=>mname(i)+(r.flex.includes(i)?" (any song)":"")).join(", "))}</div><div>${pickBtns(r,ix)}</div></div>`).join(""):`<span class="pillc">No picks yet for this period</span>`}${miss.length?`<p class="note"><b>Still waiting on (Active ${ps}):</b> ${esc(miss.join(", "))}</p>`:""}`;
}
function availV(){
 return `<div class="seg"><button data-v="all" class="${availView=="all"?"on":""}">Everyone</button><button data-v="mine" class="${availView=="mine"?"on":""}">My availability</button></div>`+(availView=="all"?availAll():availMine());
}
function availAll(){
 const ppl=D.members.filter(m=>av(m.id)),cnt=(x,h)=>ppl.filter(m=>av(m.id).includes(x+"-"+h)).length;
 const mx=Math.max(1,...DAYS.flatMap(x=>HOURS.map(h=>cnt(x,h)))),who=cell?ppl.filter(m=>av(m.id).includes(cell)):[],rest=cell?ppl.filter(m=>!av(m.id).includes(cell)):[];
 return `<div class="card"><label>Tap a time to see who is free. Darker = more people. ${actIn(curSeason()).filter(m=>av(m.id)).length} of ${actIn(curSeason()).length} Active ${curSeason()} members have submitted.</label><div class="ag"><span></span>${DAYS.map(x=>`<b>${x}</b>`).join("")}${HOURS.map(h=>`<b>${h}:00</b>`+DAYS.map(x=>{const n=cnt(x,h),k=x+"-"+h;return `<button class="sl hm ${cell==k?"sel":""}" data-c="${k}" style="${n?`background:color-mix(in srgb,var(--ac) ${Math.round(15+n/mx*75)}%,var(--card));${n/mx>.55?"color:#fff":""}`:""}">${n||""}</button>`}).join("")).join("")}</div></div>
 ${cell?`<div class="card"><h3>${esc(cell.replace("-"," "))}:00</h3><div><b class="ok" style="border:0">Free (${who.length}):</b> ${who.map(m=>`<span class="tag"><i class="dot s-${cls(m.status)}"></i>${esc(m.name)}</span>`).join("")||"nobody"}</div><div class="mu" style="margin-top:6px">Not free: ${esc(rest.map(m=>m.name).join(", ")||"nobody")}</div></div>`:""}
 <p class="note"><b>No availability yet (Active ${curSeason()}):</b> ${esc(actIn(curSeason()).filter(m=>!av(m.id)).map(m=>m.name).join(", ")||"none")}</p>`;
}
function availMine(){
 if(availMember&&draft===null)draft=[...(av(availMember)||[])];const d=draft||[];
 return `<div class="card"><label>Who are you?</label><select id="aw"><option value="">Select…</option>${D.members.filter(m=>m.status!="Left").map(m=>`<option value="${m.id}" ${m.id==availMember?"selected":""}>${esc(m.name)}${av(m.id)?" ✓":""}</option>`).join("")}</select>
 ${availMember?`<label>Tap each hour you can usually practice, weekly (9:00 to 22:00)</label><div class="ag"><span></span>${DAYS.map(x=>`<b>${x}</b>`).join("")}${HOURS.map(h=>`<b>${h}:00</b>`+DAYS.map(x=>`<button class="sl ${d.includes(x+"-"+h)?"on":""}" data-k="${x}-${h}">${d.includes(x+"-"+h)?"✓":""}</button>`).join("")).join("")}</div><button class="btn" id="asave">Save availability</button>`:`<p class="note">Pick your name to set your weekly availability.</p>`}</div>
 <p class="note">Submitted: ${actIn(curSeason()).filter(m=>av(m.id)).length} of ${actIn(curSeason()).length} Active ${curSeason()} members · <b>Missing:</b> ${esc(actIn(curSeason()).filter(m=>!av(m.id)).map(m=>m.name).join(", ")||"none")}</p>`;
}
function suggestV(){
 const res=tally().map(t=>{let best=[],bs="",sc=0;DAYS.forEach(dy=>HOURS.forEach(h=>{const has=(i,x)=>(av(i)||[]).includes(dy+"-"+x);const w=t.ids.filter(i=>has(i,h));if(!w.length)return;let e=h+1;while(e<=21&&w.every(i=>has(i,e)))e++;const s=w.length*100+(e-h);if(s>sc){sc=s;best=w;bs=dy+" "+h+":00–"+e+":00"}}));return{...t,best,bs,noav:t.ids.filter(i=>!av(i))}}).sort((a,b)=>b.best.length-a.best.length||b.ids.length-a.ids.length);
 const ok=res.filter(r=>r.best.length>=MINU).length;
 return `<div class="card"><label>Period</label>${perSel("per2")}<b class="${ok>=2?"ok":"bad"}" style="border:0">${ok} viable ${ok==1?"unit":"units"} (target: 2+)</b><p class="note">Suggestion only. Viable = ${MINU}+ interested active members share a time slot. VP dance decide.</p></div>`+(res.length?res.map(r=>`<div class="card"><h3>${esc(r.s)}</h3><span class="tag ${r.best.length>=MINU?"ok":"bad"}">${r.best.length>=MINU?"Viable":"Not enough overlap"}</span><span class="tag">${r.ids.length} interested</span>${r.bs?`<div>Best time: <b>${esc(r.bs)}</b></div><div class="mu">Can attend: ${esc(r.best.map(mname).join(", "))}</div><div class="mu">Can't: ${esc(r.ids.filter(i=>!r.best.includes(i)).map(mname).join(", ")||"nobody")}</div>`:`<div class="mu">No shared time found yet.</div>`}${r.noav.length?`<div class="mu">No availability from: ${esc(r.noav.map(mname).join(", "))}</div>`:""}</div>`).join(""):`<p class="note">No picks from active members for this period yet.</p>`);
}
function units(){return `<div class="card ann">🚧 <b>Work in progress</b> · Units are still being planned and may change.</div>`+(D.units.map(u=>`<div class="card"><h3>${esc(u.name)}</h3>${u.ids.map(i=>`<span class="tag">${esc(mname(i))}</span>`).join("")}</div>`).join("")||`<p class="note">No units yet.</p>`)}
function badCode(){CODE="";try{localStorage.removeItem("ck3code")}catch(e){}}
function showLock(msg){D=null;nav.innerHTML="";
 app.innerHTML=`<div class="card" style="max-width:380px;margin:24px auto;text-align:center"><div style="font-size:34px">🔒</div><h3>CK3 Dashboard</h3><p class="mu">Enter the access code from the Execs to continue.</p>${msg?`<p class="note" style="color:var(--no)">${esc(msg)}</p>`:""}<input id="ac" type="password" autocomplete="off" placeholder="Access code"><button class="btn" id="aenter">Enter</button></div>`;
 const go=async()=>{const v=document.getElementById("ac").value.trim();if(!v)return toast("Enter the code","err");CODE=v;
  try{await run("checkAccess");try{localStorage.setItem("ck3code",v)}catch(e){}load()}
  catch(e){const m=String(e&&e.message||e);badCode();showLock(/BAD_CODE/.test(m)?"Wrong code. Try again.":m.replace(/^Error:\s*/,""))}};
 document.getElementById("aenter").onclick=go;document.getElementById("ac").onkeydown=e=>{if(e.key=="Enter")go()};document.getElementById("ac").focus()}
async function safe(btn,fn){btn.disabled=true;try{await fn()}catch(e){toast(String(e&&e.message||e).replace(/^Error:\s*/,"").replace("BAD_CODE","The access code changed. Refresh the page and enter the new code.")||"Something went wrong. Try again.","err")}btn.disabled=false}
function bind(){
 const sgl=document.getElementById("sgl");if(sgl)sgl.onclick=e=>{e.preventDefault();openSuggest()};
 const g=id=>document.getElementById(id),vl=g("vpl");
 if(vl)vl.onclick=e=>{e.preventDefault();vpOpen=true;render()};
 if(g("vpu"))g("vpu").onclick=ev=>safe(ev.target,async()=>{const pw=g("vpw").value;await run("unlockVp",pw);vpPw=pw;render()});
 if(g("vpp"))g("vpp").onclick=ev=>safe(ev.target,async()=>{const t=g("vpt").value.trim();if(!t)return toast("Write a message first","err");await run("postUpdate",vpPw,t,g("vph").value);await load()});
 if(g("vpc"))g("vpc").onclick=()=>{vpPw="";vpOpen=false;render()};
 if(g("pdel"))g("pdel").onclick=async ev=>{if(await ask("Delete your Top 2 for this period?"))safe(ev.target,async()=>{await run("deletePicks",per,+pickMember);D.picks=D.picks.filter(p=>!(p.p==per&&p.id==pickMember));toast("Deleted","ok");render()})};
 if(g("vpx"))g("vpx").onclick=e=>{e.preventDefault();vpPw="";vpOpen=false;render()};
 app.querySelectorAll("[data-del]").forEach(a=>a.onclick=async e=>{e.preventDefault();const u=D.updates.find(x=>x.row==a.dataset.del);if(u&&await ask("Delete this update?"))safe(a,async()=>{await run("deleteUpdate",vpPw,u.row,u.text);await load()})});
 app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{availView=b.dataset.v;render()});
 app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cell=cell==b.dataset.c?"":b.dataset.c;render()});
 app.querySelectorAll("[data-st]").forEach(s=>s.onchange=()=>safe(s,async()=>{await run("saveStatus",+s.dataset.st,s.value);D.members.find(m=>m.id==s.dataset.st).status=s.value;render()}));
 ["per","per2"].forEach(id=>{const e=document.getElementById(id);if(e)e.onchange=()=>{per=e.value;render()}});
 app.querySelectorAll("[data-ps]").forEach(bt=>bt.onclick=()=>{if(!pickMember){window.scrollTo(0,0);return toast("Choose your name at the top first.","err")}
  const r=lastRows[+bt.dataset.ps],n=+bt.dataset.n,c=pk(+pickMember)||{};let a=c.a||"",b=c.b||"";if(n==1)a=r.s;else b=r.s;if(same(a,b)){if(n==1)b="";else a=""}
  safe(bt,async()=>{await run("savePicks",per,+pickMember,a,b);D.picks=D.picks.filter(p=>!(p.p==per&&p.id==pickMember)).concat({p:per,id:+pickMember,a,b});render();toast("Added as your Top "+n+" ✓","ok")})});
 const w=document.getElementById("who");if(w){w.onchange=e=>{pickMember=e.target.value;render()};
  document.getElementById("save").onclick=async ev=>{if(!pickMember)return toast("Choose your name first","err");const a=document.getElementById("a").value.trim(),b=document.getElementById("b").value.trim();if(!a&&!b){if(!pk(+pickMember))return toast("Enter at least one song.","err");if(!(await ask("Both boxes are empty. Remove your picks for this period?","Remove")))return;return safe(ev.target,async()=>{await run("deletePicks",per,+pickMember);D.picks=D.picks.filter(p=>!(p.p==per&&p.id==pickMember));toast("Removed","ok");render()})}
   safe(ev.target,async()=>{await run("savePicks",per,+pickMember,a,b);D.picks=D.picks.filter(p=>!(p.p==per&&p.id==pickMember)).concat({p:per,id:+pickMember,a,b});toast("Saved ✓","ok");render()})}}
 const aw=document.getElementById("aw");if(aw){aw.onchange=e=>{availMember=e.target.value;draft=null;render()};
  app.querySelectorAll(".sl").forEach(b=>b.onclick=()=>{const k=b.dataset.k;draft=draft.includes(k)?draft.filter(x=>x!=k):[...draft,k];render()});
  const sv=document.getElementById("asave");if(sv)sv.onclick=ev=>safe(ev.target,async()=>{await run("saveAvail",+availMember,draft);D.avail=D.avail.filter(a=>a.id!=availMember).concat({id:+availMember,slots:[...draft]});toast("Saved ✓","ok");render()})}
}
const root=document.documentElement,thm=document.getElementById("thm");
function setTheme(t,save){root.setAttribute("data-theme",t);thm.textContent=t=="dark"?"☀️":"🌙";if(save)try{localStorage.setItem("ck3t",t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem("ck3t")}catch(e){}
setTheme(saved||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),false);
thm.onclick=()=>setTheme(root.getAttribute("data-theme")=="dark"?"light":"dark",true);
/* ---- in-app notices, dialogs and guide ---- */
function toast(msg,kind){const t=document.getElementById("toast");t.textContent=msg;t.className="show "+(kind||"");clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=""},3200)}
function ask(msg,okLabel){return new Promise(res=>{const d=document.getElementById("dlg");d.hidden=false;
 d.innerHTML=`<div class="dbox" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="dbtn"><button class="gh" id="dn">Cancel</button><button class="dg" id="dy">${esc(okLabel||"Delete")}</button></div></div>`;
 const done=v=>{d.hidden=true;d.innerHTML="";res(v)};
 document.getElementById("dn").onclick=()=>done(false);document.getElementById("dy").onclick=()=>done(true);
 d.onclick=e=>{if(e.target===d)done(false)};document.getElementById("dn").focus()})}
const STEPS=[
 {t:"Welcome 👋",x:"This 1-minute tour shows what to do each two-month period. You can reopen it any time with the \'?\' button.",tab:0,sel:["#help"]},
 {t:"1. Set your status",x:"Open \"Members\" and change your own status. Please update it in the first week of each two-month period.",tab:2,sel:["#nav [data-i='2']","#app [data-st]"]},
 {t:"2. Add your availability",x:"Tap \"My availability\", choose your name, tap the hours you can practice every week, then \'Save\'.<br><br>The \"Everyone\" view shows who is free and when.",tab:4,sel:["#nav [data-i='4']",".seg"]},
 {t:"3. Pick your Top 2 songs",x:"Choose the period and your name, type up to two songs (Artist - Song), or \"Any Artist songs\" if you are open to any, then tap \'Save\'.<br><br>To fix a mistake, change the boxes and \'Save\' again, or tap \'Delete my picks\'.",tab:3,sel:["#nav [data-i='3']","#who"]},
 {t:"See what others picked",x:"Overlap in interest shows songs that several members like.<br><br><i>Like one too?</i> Choose your name, then tap \'Make Top 1\' or \'Make Top 2\' on that song.",tab:3,sel:["#app > h3"]},
 {t:"Suggested units",x:"VP Dance use \"Suggest\" to see which songs have enough people free at the same time, with the best time window.",tab:5,sel:["#nav [data-i='5']"]},
 {t:"Projects and events",x:"\"Board\" lists every dance project with its status and playlist.<br><br>\"Home\" shows upcoming events and announcements from the VP Dance.",tab:1,sel:["#nav [data-i='1']"]},
 {t:"Handy buttons",x:"\'Refresh\' loads the latest info. The \'moon/sun\' button switches light and dark mode. Tap \'?\' any time to see this tour again.",tab:0,sel:["#ref","#thm"]}];
let tourI=-1,tourAuto=false,seenMem=false;
const guideSeen=()=>{try{return !!localStorage.getItem("ck3guide")}catch(e){return seenMem}};
function tourMark(){document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));if(tourI<0)return;(STEPS[tourI].sel||[]).forEach(q=>{const e=document.querySelector(q);if(e)e.classList.add("hl")})}
function tourEnd(){tourI=-1;const b=document.getElementById("tour");b.hidden=true;b.innerHTML="";tourMark();seenMem=true;try{localStorage.setItem("ck3guide","1")}catch(e){}}
function tourShow(i){tourI=i;const s=STEPS[i],N=STEPS.length;tab=s.tab;render();
 const b=document.getElementById("tour");b.hidden=false;
 b.innerHTML=`<div class="tc">Step ${i+1} of ${N}</div><h3>${esc(s.t)}</h3><p>${s.x}</p><div class="dbtn"><button class="gh" id="tsk">${i==N-1?"Close":"Skip"}</button><span style="flex:1"></span>${i>0?`<button class="gh" id="tbk">Back</button>`:""}<button class="pr" id="tnx">${i==N-1?"Done":"Next"}</button></div>`;
 document.getElementById("tsk").onclick=tourEnd;document.getElementById("tnx").onclick=()=>i==N-1?tourEnd():tourShow(i+1);
 const bk=document.getElementById("tbk");if(bk)bk.onclick=()=>tourShow(i-1);
 const els=document.querySelectorAll(".hl");if(els.length){els[0].scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});if(els.length>1)els[els.length-1].scrollIntoView({block:"nearest",behavior:"smooth"})}}
document.getElementById("help").onclick=()=>{if(D)tourShow(0)};
document.addEventListener("keydown",e=>{if(e.key!="Escape")return;const d=document.getElementById("dlg");if(!d.hidden){const n=document.getElementById("dn")||document.getElementById("sgc");if(n)n.click()}else if(tourI>=0)tourEnd()});

function openSuggest(){const d=document.getElementById("dlg");d.hidden=false;
 d.innerHTML=`<div class="dbox" role="dialog" aria-modal="true"><h3 style="margin:0 0 6px">💡 Suggest an improvement</h3><p class="mu" style="margin:0 0 8px">Tell the Execs what would make this app better. Keep it short.</p><textarea id="sgt" rows="4" maxlength="500" placeholder="e.g. It would help if..."></textarea><input id="sgn" maxlength="40" placeholder="Your name (optional)"><div class="dbtn"><button class="gh" id="sgc">Cancel</button><button class="pr" id="sgs">Send</button></div></div>`;
 const close=()=>{d.hidden=true;d.innerHTML=""};
 document.getElementById("sgc").onclick=close;d.onclick=e=>{if(e.target===d)close()};
 document.getElementById("sgs").onclick=ev=>{const t=document.getElementById("sgt").value.trim();if(!t)return toast("Write a suggestion first","err");safe(ev.target,async()=>{await run("sendSuggestion",t,document.getElementById("sgn").value);close();toast("Thanks! Suggestion sent ✓","ok")})};
 document.getElementById("sgt").focus()}
load();
</script></body></html>
